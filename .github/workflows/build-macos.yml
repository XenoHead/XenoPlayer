name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: macOS Core (.app + .dmg)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-macos.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macos.txt

      - name: Build app and DMG
        run: python build_macos.py

      - name: Show build outputs
        run: |
          ls -lh dist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/XenoPlayer.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" dist/XenoPlayer.app/Contents/Info.plist
          file dist/XenoPlayer.app/Contents/MacOS/XenoPlayer

      - name: Verify app signature and DMG
        run: |
          codesign --verify --deep --strict --verbose=2 dist/XenoPlayer.app
          codesign -dv --verbose=4 dist/XenoPlayer.app 2>&1 | head -20
          hdiutil verify dist/*.dmg

      - name: Smoke test frozen app
        run: dist/XenoPlayer.app/Contents/MacOS/XenoPlayer --smoke-test

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/XenoPlayer.app dist/XenoPlayer-macOS.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: XenoPlayer-macOS-app
          path: dist/XenoPlayer-macOS.zip
          if-no-files-found: error

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: XenoPlayer-macOS-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: XenoPlayer-build-info
          path: build_info.json
          if-no-files-found: warn
